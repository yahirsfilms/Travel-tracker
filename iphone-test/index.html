<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#174b43" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Your travel budget, wherever you go. Private, offline expense tracking."
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
    <script>try{const t=localStorage.getItem("roam-iphone-test-appearance")||"system";document.documentElement.dataset.theme=t;document.documentElement.dataset.dark=String(t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches));}catch{}</script><meta name="apple-mobile-web-app-title" content="Roam Test"><title>Roam · iPhone test</title>
  </head>
  <body>
    <div class="shell"><p class="notice" role="note">iPhone test · fictional data only · separate storage<br>Build dcb4d00</p>
      <header>
        <a class="brand" href="#today"
          ><span class="logo"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 18 18 6M6 6h12v12" /></svg
          ></span>
          roam<span class="tag">TRAVEL BUDGET</span></a
        ><div class="header-actions"><button id="trip-picker" class="quiet">Trips ▾</button><button data-tab="settings" class="quiet" aria-label="Settings and backups">Settings</button></div>
      </header>
      <div id="status" class="status" role="status">Opening your notebook…</div>
      <div id="conflict" class="notice negative" role="alert" hidden></div><main id="main"></main>
      <nav aria-label="Main navigation">
        <button data-tab="today">◷ <span>Today</span></button
        ><button data-tab="history">☷ <span>History</span></button
        ><button data-tab="trip">◇ <span>Trips</span></button><button data-tab="money">◎ <span>Money</span></button>
      </nav>
    </div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <div id="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
